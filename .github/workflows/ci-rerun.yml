# Owner decision D-15 (docs/decisions/0007): a latency gate blocks only if its
# rerun also fails, and the rerun must land on a FRESH runner (a retry inside
# the same job reuses a slow machine). When a `ci` run finishes with failure on
# its first attempt and every failed job (other than the aggregate `check`) is
# a latency shard, rerun the failed jobs once. Unit and static failures are
# never rerun. On attempt 2 this does nothing, so a second failure blocks.
# No checkout, no pull-request code, no third-party action. A workflow_run
# workflow runs from the default branch's copy of this file, so it takes effect
# once it is on main.
name: ci-rerun

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name != "check" and (.conclusion | IN("success", "skipped") | not)) | .name')
          echo "failed jobs: $failed"
          if [ -n "$failed" ] && ! printf '%s\n' "$failed" | grep -qv '^latency'; then
            gh run rerun "$RUN_ID" --failed --repo "$REPO"
            printf '### Rerunning ci run %s once (attempt 2)\nOnly latency shards failed:\n```\n%s\n```\n' "$RUN_ID" "$failed" >>"$GITHUB_STEP_SUMMARY"
          else
            printf '### No rerun for ci run %s\nA non-latency job failed or none was found:\n```\n%s\n```\n' "$RUN_ID" "$failed" >>"$GITHUB_STEP_SUMMARY"
          fi
