# CI runs the gate of `make check` as parallel jobs (docs/decisions/0007):
# every job is a Makefile target that `make check` also runs, so they cannot
# drift. Branch protection (main) and the ruleset (plan-*) require the job
# named `check`, the aggregate at the bottom; do not rename it.
name: ci

on:
  pull_request:
  push:
    branches: [main, "plan-*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # First job: decides docs_only from the pull request's changed files
  # (scripts/ci-docs-only.sh) and publishes the shard matrices from the
  # Makefile's counts. Not a workflow-level paths filter: that would leave the
  # required `check` pending on a docs-only pull request. A push, or a diff
  # that cannot be computed, is NOT docs-only.
  plan:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      latency: ${{ steps.shards.outputs.latency }}
      cmd: ${{ steps.shards.outputs.cmd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: shards
        run: make -s shard-matrices >> "$GITHUB_OUTPUT"
      - id: docs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only --no-renames "$BASE_SHA" HEAD); then
            docs_only=$(printf '%s\n' "$files" | scripts/ci-docs-only.sh)
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the toolchain directive in go.mod, so CI uses the same Go as local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned tool binaries; the key changes whenever a version in the
      # Makefile or the Go toolchain changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - run: make check-static check-shards

  # Step 1 of the tests, in jobs: cmd/curia (the slowest package) sharded by
  # test name, internal/store alone, every other package (computed, so a new
  # package is never forgotten). Shard counts live in the Makefile only;
  # `make check-shards` fails if a shard set is not a partition or the unit
  # jobs miss a package. tmux is installed so the real-tmux tests run instead
  # of skipping. The test jobs are skipped on a docs-only pull request.
  unit-cmd:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.cmd) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit-cmd SHARD=${{ matrix.shard }}

  unit-store:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit-store

  unit-rest:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit-rest

  # Step 2: the latency gates, one shard of gates per runner (count in the
  # Makefile), each package run alone with -p 1 (D-1).
  latency:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.latency) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # D-15: a failed first attempt is rerun once on a fresh runner by ci-rerun.yml.
      - if: github.run_attempt > 1
        run: echo "::warning::latency shard ${{ matrix.shard }} is an automatic rerun (attempt ${{ github.run_attempt }}) after a failed first attempt (ci-rerun.yml, D-15)"
      - run: make test-latency SHARD=${{ matrix.shard }}

  # The required status check. Passes only if every job above succeeded:
  # failed, cancelled and skipped all fail it (if: always() so it still runs).
  # One exception: when plan says docs_only, the four test jobs must all be
  # skipped (and nothing else is), while plan and static must still succeed.
  check:
    name: check
    if: always()
    needs: [plan, static, unit-cmd, unit-store, unit-rest, latency]
    runs-on: ubuntu-latest
    steps:
      # A matrix job's result is success only if every shard succeeded.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          results() { echo "$NEEDS" | jq -r "[$1 | .result] | unique | join(\",\")"; }
          if [ "$(echo "$NEEDS" | jq -r .plan.outputs.docs_only)" = true ]; then
            test "$(results '.plan, .static')" = success
            test "$(results '.["unit-cmd"], .["unit-store"], .["unit-rest"], .latency')" = skipped
          else
            test "$(results '.[]')" = success
          fi
