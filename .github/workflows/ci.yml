# CI runs the gate of `make check` as parallel jobs (docs/decisions/0007):
# every job is a Makefile target that `make check` also runs, so they cannot
# drift. Branch protection (main) and the ruleset (plan-*) require the job
# named `check`, the aggregate at the bottom; do not rename it.
name: ci

on:
  pull_request:
  push:
    branches: [main, "plan-*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the toolchain directive in go.mod, so CI uses the same Go as local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned tool binaries; the key changes whenever a version in the
      # Makefile or the Go toolchain changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - run: make check-static check-shards

  # Step 1 of the tests, in jobs: cmd/curia (the slowest package) sharded by
  # test name, every other package (computed, so a new package is never
  # forgotten). Shard counts live in the Makefile; `make check-shards` fails
  # if a matrix below does not list 0..N-1 or a shard set is not a partition.
  # tmux is installed so the real-tmux tests run instead of skipping.
  unit-cmd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3] # cmd-shards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit-cmd SHARD=${{ matrix.shard }}

  unit-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit UNIT_PKGS="$(go list ./... | grep -v '/cmd/curia$' | tr '\n' ' ')"

  # Step 2: the latency gates, one shard of packages per runner, each package
  # run alone with -p 1 (D-1).
  latency:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2] # latency-shards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      # D-15: a failed run is rerun once (scripts/ci-retry-once.sh); the job fails only if the rerun fails too.
      - run: scripts/ci-retry-once.sh make test-latency SHARD=${{ matrix.shard }}

  # The required status check. Passes only if every job above succeeded:
  # failed, cancelled and skipped all fail it (if: always() so it still runs).
  check:
    name: check
    if: always()
    needs: [static, unit-cmd, unit-rest, latency]
    runs-on: ubuntu-latest
    steps:
      # A matrix job's result is success only if every shard succeeded.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          test "$(echo "$NEEDS" | jq -r '[.[].result] | unique | join(",")')" = success
