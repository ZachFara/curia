# CI runs the gate of `make check` as parallel jobs (docs/decisions/0007):
# every job is a Makefile target that `make check` also runs, so they cannot
# drift. Branch protection (main) and the ruleset (plan-*) require the job
# named `check`, the aggregate at the bottom; do not rename it.
name: ci

on:
  pull_request:
  push:
    branches: [main, plan-1, plan-2, plan-3, plan-4, plan-5]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the toolchain directive in go.mod, so CI uses the same Go as local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned tool binaries; the key changes whenever a version in the
      # Makefile or the Go toolchain changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: bin-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - run: make check-static

  # Step 1 of the tests, in two jobs: cmd/curia alone (the slowest package),
  # every other package (computed, so a new package is never forgotten).
  # tmux is installed so the real-tmux tests run instead of skipping.
  unit-cmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit UNIT_PKGS=./cmd/curia

  unit-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-unit UNIT_PKGS="$(go list ./... | grep -v '/cmd/curia$' | tr '\n' ' ')"

  # Step 2: the latency gates, alone on their own runner (D-1).
  latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: make test-latency

  # The required status check. Passes only if every job above succeeded:
  # failed, cancelled and skipped all fail it (if: always() so it still runs).
  check:
    name: check
    if: always()
    needs: [static, unit-cmd, unit-rest, latency]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.static.result }}${{ needs.unit-cmd.result }}${{ needs.unit-rest.result }}${{ needs.latency.result }}" = successsuccesssuccesssuccess
