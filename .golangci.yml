          allow:
            - $gostd
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "e2e drives the built binary only and imports no internal package (docs/decisions/0003)"

        # Fail closed for any Go file outside the packages above (a new
        # directory the table does not list): it may not import this module.
        unlisted:
          list-mode: lax
          files:
            - $all
            - "!**/internal/model/**"
            - "!**/internal/config/**"
            - "!**/internal/sanitize/**"
            - "!**/internal/decision/**"
            - "!**/internal/precedent/**"
            - "!**/internal/store/**"
            - "!**/internal/state/**"
            - "!**/internal/transcript/**"
            - "!**/internal/hook/**"
            - "!**/internal/tmux/**"
            - "!**/internal/fleet/**"
            - "!**/internal/attention/**"
            - "!**/internal/notify/**"
            - "!**/internal/deliver/**"
            - "!**/internal/mcp/**"
            - "!**/internal/ui/**"
            - "!**/internal/install/**"
            - "!**/cmd/curia/**"
            - "!**/e2e/**"
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "this directory is not in the plan's File structure table; add a depguard rule first (docs/decisions/0003)"

