# golangci-lint v2 configuration. Strict by design; see
# docs/decisions/0002 (linters and thresholds), docs/decisions/0003 and
# 0010 (depguard package boundaries). Thresholds are never raised and no
# exclusions are added after setup (AGENTS.md, ENGINEERING).
version: "2"

run:
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    # correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - errorlint
    - bodyclose
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - gosec
    # unused code
    - unused
    - unparam
    # complexity limits (run by `make complexity`)
    - gocyclo
    - gocognit
    - funlen
    - nestif
    # package boundaries (run by `make boundaries`)
    - depguard
    # style
    - revive
    - misspell
    - unconvert
    - gocritic
    # suppression hygiene
    - nolintlint

  settings:
    govet:
      enable-all: true
      disable:
        # Struct field order follows the plan's documented types, not memory layout.
        - fieldalignment

    errcheck:
      check-type-assertions: true

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    funlen:
      lines: 60
      statements: 40
      ignore-comments: true

    nestif:
      min-complexity: 4

    misspell:
      locale: US

    nolintlint:
      # Any //nolint must name the linter and say why. `make suppressions`
      # additionally rejects every suppression outright.
      require-explanation: true
      require-specific: true
      allow-unused: false

    gosec:
      excludes:
        # G204: tmux, git and the e2e test run fixed programs with argv
        # arguments by design, never through a shell (docs/decisions/0002).
        - G204

    depguard:
      # Package boundaries from the plan's File structure table: each package
      # may import the standard library, the third-party modules it needs, and
      # only the internal packages ABOVE it in the table. Every rule is strict
      # (fail closed): an import not on the allow list is rejected.
      # Order of the table (docs/decisions/0010): model, config, sanitize,
      # decision, precedent, store, state, transcript, hook, tmux, fleet,
      # attention, notify, deliver, mcp, ui, install, cmd/curia.
      rules:
        model:
          list-mode: strict
          files:
            - "**/internal/model/**"
          allow:
            - $gostd
            - github.com/ZachFara/curia/internal/model$
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "internal/model imports the standard library only (docs/decisions/0003)"

        config:
          list-mode: strict
          files:
            - "**/internal/config/**"
          allow:
            - $gostd
            - github.com/BurntSushi/toml
            - github.com/ZachFara/curia/internal/model$
            - github.com/ZachFara/curia/internal/config$
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "internal/config may import only internal packages above it: model (docs/decisions/0003)"

        sanitize:
          list-mode: strict
          files:
            - "**/internal/sanitize/**"
          allow:
            - $gostd
            - github.com/ZachFara/curia/internal/model$
            - github.com/ZachFara/curia/internal/config$
            - github.com/ZachFara/curia/internal/sanitize$
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "internal/sanitize may import only internal packages above it: model, config (docs/decisions/0010)"

        decision:
          list-mode: strict
          files:
            - "**/internal/decision/**"
          allow:
            - $gostd
            - github.com/ZachFara/curia/internal/model$
            - github.com/ZachFara/curia/internal/config$
            - github.com/ZachFara/curia/internal/sanitize$
            - github.com/ZachFara/curia/internal/decision$
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "internal/decision may import only internal packages above it: model, config, sanitize (docs/decisions/0010)"

        precedent:
          list-mode: strict
          files:
            - "**/internal/precedent/**"
          allow:
            - $gostd
            - github.com/ZachFara/curia/internal/model$
            - github.com/ZachFara/curia/internal/config$
            - github.com/ZachFara/curia/internal/sanitize$
            - github.com/ZachFara/curia/internal/decision$
            - github.com/ZachFara/curia/internal/precedent$
          deny:
            - pkg: github.com/ZachFara/curia
              desc: "internal/precedent may import only internal packages above it: model to decision (docs/decisions/0010)"

        store:
