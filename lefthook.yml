# Git hooks (docs/decisions/0005). Install once per clone with `lefthook install`.
# pre-commit runs the fast `make check-fast`; CI runs the full `make check`
# and is the required gate (docs/decisions/0007, amended 2026-11-19).
# Never bypass with --no-verify.

pre-commit:
  jobs:
    - name: make check-fast
      run: make check-fast

commit-msg:
  jobs:
    - name: conventional commit
      run: scripts/check-commit-msg.sh {1}
